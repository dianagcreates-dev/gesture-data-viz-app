<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gesture Data Viz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600;700&family=Sora:wght@400;600;700&family=Outfit:wght@400;600;700&family=Manrope:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@400;700&family=Lora:wght@400;600;700&family=DM+Serif+Display&family=Cormorant+Garamond:wght@400;600;700&family=Bebas+Neue&family=Anton&family=Righteous&family=Bungee&family=Passion+One:wght@400;700&family=Abril+Fatface&family=Archivo+Black&family=JetBrains+Mono:wght@400;600;700&family=Space+Mono:wght@400;700&family=Pacifico&family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&display=swap');
  :root{
    --bg:#05070c; --bg2:#0e1420; --panel:#131a29; --line:#232f47;
    --ink:#eaf0fa; --dim:#7e8fb0; --dimmer:#54648a; --accent:#5ad1c4; --hot:#ff6b8a;
    --disp:"Space Grotesk", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
    --uiFont:"Inter", system-ui, sans-serif;
    --titleFont:var(--disp); --titleSize:16px; --titleColor:#eaf0fa;
    --subtitleFont:var(--disp); --subtitleSize:14px; --subtitleColor:#7e8fb0; --labelFont:var(--disp);
    --labelWeight:600; --labelStyle:normal; --labelSize:12px; --labelColor:#eaf0fa;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--uiFont);font-size:14px;line-height:1.45;overflow:hidden;}
  .app{display:grid;grid-template-columns:390px 1fr;height:100vh;height:100dvh;transition:grid-template-columns .35s ease;}
  .app.presenting,.app.collapsed{grid-template-columns:0 1fr;}
  .app.presenting .console,.app.collapsed .console{opacity:0;pointer-events:none;}
  .app.presenting .vpHint{opacity:0;}
  .app.presenting .slideStrip{display:none;}
  .stage{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  @media (max-width:1024px){ .app{grid-template-columns:320px 1fr;} }
  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:45vh 1fr;grid-template-rows:45dvh 1fr;}
    .app.presenting,.app.collapsed{grid-template-rows:0 1fr;}
    .titleTools{flex-wrap:wrap;justify-content:flex-end;}
  }
  @media (max-width:480px){
    .handPreview{width:130px;height:98px;}
    .slideChip,.addSlideBtn{width:74px;height:50px;}
    .iconBtn,.colorSwatchBtn{width:32px;height:32px;}
  }
  #expandBtn{position:absolute;top:16px;left:16px;z-index:9;display:none;background:rgba(14,20,32,.8);
    border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:15px;line-height:1;
    padding:8px 12px;cursor:pointer;}
  #expandBtn:hover{border-color:var(--accent);color:var(--accent);}
  .app.collapsed #expandBtn{display:block;}
  #floatingPresentBtn{position:absolute;top:16px;right:16px;z-index:9;display:none;background:var(--accent);
    border:1px solid var(--accent);border-radius:8px;color:#052321;font-family:var(--uiFont);font-size:13px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;cursor:pointer;}
  #floatingPresentBtn:hover{filter:brightness(.92);}
  .app.collapsed #floatingPresentBtn{display:block;}
  .app.presenting #floatingPresentBtn{display:none;}

  .console{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;transition:opacity .25s,background-color .2s,border-color .2s;
    scrollbar-width:thin;scrollbar-color:var(--dimmer) transparent;}
  .console::-webkit-scrollbar{width:8px;}
  .console::-webkit-scrollbar-track{background:transparent;}
  .console::-webkit-scrollbar-thumb{background:var(--dimmer);border-radius:4px;}
  .console::-webkit-scrollbar-thumb:hover{background:var(--dim);}
  .slideStrip{flex:none;display:flex;gap:8px;padding:12px 16px;overflow-x:auto;
    background:var(--bg2);border-top:1px solid var(--line);transition:background-color .2s,border-color .2s;}
  .console,.slideStrip{
    --bg2:#2c2c2c; --panel:#1e1e1e; --line:#444444;
    --ink:#ffffff; --dim:#b3b3b3; --dimmer:#8c8c8c;
    --accent:#ffffff; --accentText:#111111;
  }
  .console.theme-light,.slideStrip.theme-light{
    --bg2:#ffffff; --panel:#f5f5f5; --line:#e6e6e6;
    --ink:#1e1e1e; --dim:#737373; --dimmer:#8c8c8c;
    --accent:#5b6472; --accentText:#ffffff; --hot:#e0345c;
  }
  .consoleTop{flex:none;display:flex;justify-content:space-between;padding:12px 18px 0;}
  .themeToggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--dim);
    cursor:pointer;font-size:14px;line-height:1;transition:border-color .15s,color .15s;}
  .themeToggle:hover{border-color:var(--accent);color:var(--accent);}
  .themeToggle .iconMoon{display:none;}
  .console.theme-light .themeToggle .iconSun{display:none;}
  .console.theme-light .themeToggle .iconMoon{display:inline;}
  .slideChip{position:relative;flex:none;width:92px;height:62px;border-radius:8px;border:1px solid var(--line);
    background-color:var(--panel);background-size:cover;background-position:center;cursor:grab;overflow:hidden;
    padding:0;transition:border-color .12s,transform .12s;touch-action:none;}
  .slideChip:hover{border-color:var(--accent);}
  .slideChip.active{border-color:var(--accent);}
  .slideChip.dragging{cursor:grabbing;z-index:5;border-color:var(--accent);transition:transform .08s ease-out,border-color .12s;}
  .slideChip.dragOver{border-color:var(--accent);transform:scale(1.04);}
  .slideChip .num{position:absolute;top:4px;left:5px;font-family:var(--mono);font-size:9px;color:#fff;
    text-shadow:0 1px 4px #000;background:rgba(0,0,0,.4);border-radius:4px;padding:1px 4px;}
  .slideChip .rm{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.25);color:#fff;font-size:10px;line-height:14px;text-align:center;
    display:flex;align-items:center;justify-content:center;}
  .slideChip .rm:hover{color:var(--hot);border-color:var(--hot);background:var(--panel);}
  .addSlideBtn{flex:none;width:92px;height:62px;border-radius:8px;border:1px dashed var(--line);background:none;
    color:var(--dim);cursor:pointer;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.12s;}
  .addSlideBtn:hover{border-color:var(--accent);color:var(--accent);}
  .field{padding:12px 18px 0;}
  .field label{display:block;font-family:var(--uiFont);font-size:13px;font-weight:500;letter-spacing:0;color:var(--dim);margin-bottom:5px;}
  .titleInput{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font-family:var(--titleFont);font-weight:600;font-size:15px;padding:8px 10px;}
  .titleInput:focus{outline:none;border-color:var(--accent);}
  .subtitleInput{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font-family:var(--subtitleFont);font-weight:500;font-size:13px;padding:8px 10px;}
  .subtitleInput:focus{outline:none;border-color:var(--accent);}
  .fontPanel{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:260px;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:6px;display:none;flex-direction:column;gap:1px;z-index:20;}
  .fontPanel.open{display:flex;}
  .fontPanel::-webkit-scrollbar{width:8px;}
  .fontPanel::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .fontPanel::-webkit-scrollbar-track{background:transparent;}
  .fontOption{text-align:left;background:none;border:1px solid transparent;border-radius:6px;color:var(--ink);
    font-size:14px;padding:8px 10px;cursor:pointer;transition:background .1s;}
  .fontOption:hover{background:rgba(255,255,255,.06);}
  .fontOption.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
  .titleFieldRow{display:flex;gap:8px;align-items:flex-start;}
  .titleFieldRow .titleInput{flex:1;min-width:0;}
  .titleTools{display:flex;gap:6px;flex:none;}
  .toolWrap{position:relative;flex:none;}
  .colorFieldWrap{position:relative;flex:none;}
  .iconBtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-family:var(--uiFont);font-size:13px;font-weight:600;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
  .iconBtn:hover{border-color:var(--accent);}
  .iconBtn.active{background:var(--accent);color:var(--accentText);border-color:var(--accent);}
  .italicIcon{display:inline-block;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;font-size:15px;}
  .colorSwatchBtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);cursor:pointer;padding:0;transition:border-color .15s;}
  .colorSwatchBtn:hover{border-color:var(--accent);}
  .colorPanel{position:absolute;top:calc(100% + 6px);right:0;width:180px;max-width:calc(100vw - 48px);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:10px;display:none;flex-direction:column;gap:10px;z-index:20;}
  .colorPanel.open{display:flex;}
  .colorSwatchGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .colorSwatchOption{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:border-color .12s;}
  .colorSwatchOption:hover{border-color:var(--line);}
  .colorSwatchOption.active{border-color:var(--accent);}
  .colorCustomRow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:9px;}
  .colorCustomRow input[type=color]{width:32px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer;}
  .gestureRows{display:flex;flex-direction:column;gap:6px;}
  .gestureRow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .gestureRow .actionLabel{font-family:var(--uiFont);font-size:12.5px;color:var(--dim);}
  .gestureBtn{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;cursor:pointer;color:var(--ink);font-family:var(--uiFont);font-size:12px;transition:border-color .15s;}
  .gestureBtn:hover{border-color:var(--accent);}
  .gestureBtn.unassigned{opacity:.55;font-style:italic;}
  .gestureOption.noneOption{color:var(--dim);border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px;padding-bottom:8px;}
  .gestureOption.noneOption:hover{background:none;color:var(--hot);}
  .gesturePanel{position:absolute;top:calc(100% + 6px);right:0;width:170px;max-width:calc(100vw - 48px);display:none;flex-direction:column;gap:2px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px;z-index:20;}
  .gesturePanel.open{display:flex;}
  .gestureOption{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:7px;
    padding:6px 8px;cursor:pointer;color:var(--ink);font-family:var(--uiFont);font-size:12px;text-align:left;transition:border-color .12s,background-color .12s;}
  .gestureOption:hover{background:var(--bg2);}
  .gestureOption.active{border-color:var(--accent);}
  .handIcon{flex:none;font-size:15px;line-height:1;filter:grayscale(1) contrast(1.15) brightness(1.05);}
  .handPreview{position:absolute;left:85%;top:78%;transform:translate(-50%,-50%);width:180px;height:135px;border-radius:10px;
    overflow:hidden;border:1px solid rgba(255,255,255,.18);background:#000;display:none;z-index:5;cursor:grab;touch-action:none;}
  .handPreview.show{display:block;}
  .handPreview.dragging{cursor:grabbing;}
  .app.presenting .handPreview{pointer-events:none;cursor:default;}
  .handPreview video,.handPreview canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);pointer-events:none;}
  .handPreview video{display:none;}
  .handPreviewStatus{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
    padding:12px;font-family:var(--uiFont);font-size:11.5px;line-height:1.4;color:var(--dim);background:rgba(8,12,20,.92);}
  .handPreviewStatus.show{display:flex;}
  .handPreviewIcon{color:var(--dim);flex:none;}
  .handPreviewIcon .slashLine{display:none;color:#ff9d9d;}
  .handPreviewStatus.error .handPreviewIcon .slashLine{display:block;}
  .colorCustomRow span{font-size:11px;color:var(--dim);}
  .sizeVal{text-transform:none;letter-spacing:0;color:var(--dimmer);font-size:10px;}
  .sizeIconInput{text-align:center;cursor:ew-resize;}
  .sizeIconInput:focus{outline:none;border-color:var(--accent);cursor:text;}
  .sizeIconInput.scrubbing{border-color:var(--accent);}
  .sizeIconInput::-webkit-outer-spin-button,.sizeIconInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sizeIconInput{-moz-appearance:textfield;appearance:textfield;}
  #fontPanel,#subtitleFontPanel,#labelFontPanel{left:0;right:auto;width:210px;max-width:calc(100vw - 48px);}
  .tableWrap{padding:14px 18px 4px;}
  .thead,.trow{display:grid;grid-template-columns:1fr 66px 1fr 22px;gap:6px;align-items:center;}
  .thead{font-family:var(--uiFont);font-size:12px;font-weight:500;letter-spacing:0;text-transform:uppercase;color:var(--dimmer);padding:0 2px 6px;}
  .trow{margin-bottom:6px;}
  .trow input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);
    font-family:var(--uiFont);font-size:13px;line-height:1.4;padding:6px 7px;}
  .trow input:focus{outline:none;border-color:var(--accent);}
  .trow input.num{text-align:right;}
  .trow input.bad{border-color:var(--hot);}
  .swatch{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor;}
  .grpCell{display:flex;align-items:center;gap:6px;}
  .grpCell input{flex:1;}
  .del{background:none;border:none;color:var(--dimmer);cursor:pointer;font-size:15px;line-height:1;padding:0;}
  .del:hover{color:var(--hot);}
  .addRow{width:100%;margin-top:2px;background:none;border:1px dashed var(--line);border-radius:7px;color:var(--dim);
    font-family:var(--uiFont);font-size:13px;font-weight:500;padding:8px;cursor:pointer;letter-spacing:0;}
  .addRow:hover{border-color:var(--accent);color:var(--ink);}
  .cfoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:10px;}
  .warnMsg{font-size:10px;letter-spacing:.06em;color:var(--hot);text-align:center;min-height:13px;opacity:0;transition:opacity .2s;}
  .warnMsg.show{opacity:1;}
  .segRow{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;}
  .segRow .seg{flex:1;background:none;border:none;border-radius:6px;color:var(--dimmer);
    font-family:var(--uiFont);font-size:13px;font-weight:500;letter-spacing:0;padding:7px 4px;cursor:pointer;transition:background .15s,color .15s;}
  .segRow .seg:hover{color:var(--ink);}
  .segRow .seg.active{background:var(--accent);color:var(--accentText);font-weight:600;}
  .segRow.slider{position:relative;}
  .segRow.slider .seg{position:relative;z-index:1;transition:color .2s;}
  .segRow.slider .seg.active{background:none;}
  .segThumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:6px;
    background:var(--accent);z-index:0;pointer-events:none;
    transition:left .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1);}
  .chartTypeHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
  .chartTypeHead label{margin-bottom:0;}
  .addRuleBtn{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel);
    color:var(--dim);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0;transition:border-color .15s,color .15s;}
  .addRuleBtn:hover{border-color:var(--accent);color:var(--accent);}
  .chartRule{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:10px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;}
  .chartRuleHead{display:flex;gap:8px;align-items:center;}
  .chartRuleTag{flex:1;min-width:0;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dimmer);}
  .chartRule select.ruleGroup{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font-family:var(--uiFont);font-size:12px;padding:6px 5px;}
  .chartRule select.ruleGroup:focus{outline:none;border-color:var(--accent);}
  .chartRule .segRow{width:100%;}
  .removeRuleBtn{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel);
    color:var(--dim);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .removeRuleBtn:hover{border-color:var(--hot);color:var(--hot);}
  .segWithDrop{flex:1;position:relative;display:flex;background:none;border-radius:6px;}
  .segWithDrop .seg{border-radius:6px;width:100%;}
  .stylePanel{position:absolute;top:100%;left:0;right:0;display:none;flex-direction:column;gap:1px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px;z-index:20;}
  .segWithDrop:hover .stylePanel{display:flex;}
  .styleOption{text-align:left;background:none;border:1px solid transparent;border-radius:6px;color:var(--ink);
    font-family:var(--uiFont);font-size:13px;padding:7px 10px;cursor:pointer;transition:background .1s;}
  .styleOption:hover{background:rgba(255,255,255,.06);}
  .styleOption.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
  .cfootField label{display:block;font-family:var(--uiFont);font-size:13px;font-weight:500;letter-spacing:0;color:var(--dim);margin-bottom:5px;}
  .swatchRow{display:flex;gap:8px;}
  .bgSwatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:none;
    padding:0;transition:border-color .12s,box-shadow .12s;}
  .bgSwatch:hover{border-color:var(--dim);}
  .bgSwatch.active{border-color:var(--accent);}
  .presentBtn{width:100%;background:var(--accent);border:1px solid var(--accent);border-radius:9px;
    color:var(--accentText);font-family:var(--uiFont);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:12px;cursor:pointer;transition:filter .15s;}
  .presentBtn:hover{filter:brightness(.92);}
  .meshEditor{display:none;flex-direction:column;gap:8px;margin-top:8px;}
  .meshCanvas{position:relative;width:100%;height:100px;border-radius:10px;border:1px solid var(--line);overflow:hidden;touch-action:none;}
  .meshDot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid rgba(255,255,255,.85);
    box-shadow:0 0 8px rgba(0,0,0,.5);cursor:grab;touch-action:none;}
  .meshDot:hover{border-color:#fff;}
  .meshDot.dragging{cursor:grabbing;}
  .meshPointRow{display:flex;flex-direction:column;gap:5px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .meshPointRow:last-of-type{border-bottom:none;padding-bottom:0;}
  .meshPointTop{display:flex;align-items:center;gap:8px;}
  .meshPointTop span{flex:1;font-family:var(--uiFont);font-size:12px;color:var(--dim);}
  .meshRadiusRow{display:flex;align-items:center;gap:7px;}
  .meshRadiusRow label{font-family:var(--uiFont);font-size:10px;color:var(--dimmer);flex:none;}
  .meshRadiusSlider{flex:1;accent-color:var(--accent);cursor:pointer;}
  .meshColorWrap{position:relative;flex:none;}
  .meshColorBtn{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;display:block;}
  .meshColorPicker{display:none;flex-direction:column;gap:10px;position:absolute;top:calc(100% + 6px);left:0;z-index:30;
    width:170px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.5);}
  .meshColorPicker.open{display:flex;}
  .meshSVSquare{position:relative;width:100%;height:110px;border-radius:8px;cursor:crosshair;touch-action:none;}
  .meshSVHandle{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 4px rgba(0,0,0,.7);pointer-events:none;}
  .meshHueSlider{position:relative;width:100%;height:14px;border-radius:7px;cursor:pointer;touch-action:none;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
  .meshHueHandle{position:absolute;top:-2px;width:6px;height:18px;margin-left:-3px;border-radius:3px;background:#fff;
    border:1px solid rgba(0,0,0,.4);pointer-events:none;}

  .viewport{position:relative;flex:1;min-height:0;overflow:hidden;background:
    radial-gradient(140% 110% at 50% 45%, #0c1730 0%, #06090f 55%, #04060a 100%);cursor:grab;}
  .viewport.drag{cursor:grabbing;}
  #gl{position:absolute;inset:0;}
  #labels{position:absolute;inset:0;pointer-events:none;}
  .swLabel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--labelFont);
    font-size:var(--labelSize);font-weight:var(--labelWeight);font-style:var(--labelStyle);color:var(--labelColor);text-shadow:0 1px 6px #000;background:rgba(6,9,16,.88);
    padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.18);
    box-shadow:0 3px 18px rgba(0,0,0,.6);backdrop-filter:blur(3px);transition:background .15s,border-color .15s,box-shadow .15s;}
  .swLabel.style-minimal{background:none;border:none;box-shadow:none;backdrop-filter:none;padding:2px 4px;}
  .swLabel.style-outline{background:rgba(6,9,16,.3);border-width:1.5px;box-shadow:none;backdrop-filter:none;}
  #callouts{position:absolute;inset:0;pointer-events:none;}
  .calloutLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .calloutLine{fill:none;stroke:#fff;stroke-width:1.25;stroke-linejoin:round;opacity:.7;}
  .swLabel.callout{display:flex;align-items:center;background:rgba(255,255,255,.10);
    border-color:rgba(255,255,255,.35);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);
    box-shadow:0 4px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);}
  .swLabel.callout .dotSwatch{order:1;margin-right:10px;}
  .swLabel.callout .calloutLabelText{order:2;}
  .swLabel.callout .calloutVal{order:3;margin-left:7px;padding-left:7px;border-left:1px solid rgba(255,255,255,.25);color:var(--dimmer);font-size:10px;font-family:var(--mono);}
  .swLabel.callout.calloutRight .dotSwatch{order:3;margin-right:0;margin-left:10px;}
  .swLabel.callout.calloutRight .calloutLabelText{order:2;}
  .swLabel.callout.calloutRight .calloutVal{order:1;margin-left:0;padding-left:0;border-left:none;margin-right:7px;padding-right:7px;border-right:1px solid rgba(255,255,255,.25);}
  .dotSwatch{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle;box-shadow:0 0 7px currentColor;flex:none;}
  .legendCol{position:absolute;transform:translate(-50%,-50%);max-height:70%;overflow-y:auto;display:none;
    flex-direction:column;gap:9px;pointer-events:auto;cursor:grab;background:rgba(5,7,12,.55);border:1px solid rgba(255,255,255,.07);
    border-radius:10px;padding:12px 14px;backdrop-filter:blur(2px);touch-action:none;}
  .legendCol.dragging{cursor:grabbing;}
  .app.presenting .legendCol{pointer-events:none;cursor:default;}
  .legendCol.style-chips{gap:6px;background:none;border:none;border-radius:0;padding:0;backdrop-filter:none;}
  .legendItem{display:flex;align-items:center;font-size:calc(var(--labelSize) * 0.92);color:var(--labelColor);white-space:nowrap;font-family:var(--labelFont);
    font-weight:var(--labelWeight);font-style:var(--labelStyle);text-shadow:0 1px 8px #000;}
  .legendItem.style-chips{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;}
  .legendVal{margin-left:auto;padding-left:12px;color:var(--dimmer);font-size:10px;font-family:var(--mono);}
  .vpTitle{position:absolute;left:50%;top:6%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;
    font-family:var(--titleFont);font-weight:600;font-size:var(--titleSize);letter-spacing:.02em;color:var(--titleColor);
    text-shadow:0 2px 14px #000;pointer-events:auto;cursor:grab;user-select:none;touch-action:none;
    padding:4px 10px;border-radius:8px;transition:background .12s;}
  .vpTitle.boxEmpty.fontChosen::before{content:"Your title text";opacity:.35;}
  .app.presenting .vpTitle.boxEmpty::before{content:none;}
  .vpTitle:hover{background:rgba(255,255,255,.05);}
  .vpTitle.dragging{cursor:grabbing;background:rgba(255,255,255,.08);transition:none;}
  .vpTitle.bold{font-weight:700;}
  .vpTitle.italic{font-style:italic;}
  .app.presenting .vpTitle{pointer-events:none;cursor:default;}
  .vpSubtitle{position:absolute;left:50%;top:13%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;
    font-family:var(--subtitleFont);font-weight:400;font-size:var(--subtitleSize);letter-spacing:.02em;color:var(--subtitleColor);
    text-shadow:0 2px 14px #000;pointer-events:auto;cursor:grab;user-select:none;touch-action:none;
    padding:4px 10px;border-radius:8px;transition:background .12s;}
  .vpSubtitle.boxEmpty.fontChosen::before{content:"Your subtitle text";opacity:.35;}
  .app.presenting .vpSubtitle.boxEmpty::before{content:none;}
  .vpSubtitle:hover{background:rgba(255,255,255,.05);}
  .vpSubtitle.dragging{cursor:grabbing;background:rgba(255,255,255,.08);transition:none;}
  .vpSubtitle.bold{font-weight:700;}
  .vpSubtitle.italic{font-style:italic;}
  .vpExtraText{position:absolute;text-align:center;white-space:nowrap;
    font-family:var(--disp);font-weight:500;color:#eaf0fa;
    text-shadow:0 2px 14px #000;pointer-events:auto;cursor:grab;user-select:none;touch-action:none;
    padding:4px 10px;border-radius:8px;transition:background .12s;}
  .vpExtraText:hover{background:rgba(255,255,255,.05);}
  .vpExtraText.dragging{cursor:grabbing;background:rgba(255,255,255,.08);transition:none;}
  .app.presenting .vpExtraText{pointer-events:none;cursor:default;}
  .vpTitle[contenteditable="true"],.vpSubtitle[contenteditable="true"],.vpExtraText[contenteditable="true"]{
    cursor:text;user-select:text;background:rgba(255,255,255,.08);outline:1px solid var(--accent);outline-offset:5px;}
  .resizeHandle{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;border-radius:3px;
    background:transparent;border:1px solid transparent;cursor:nwse-resize;touch-action:none;}
  .resizeHandle:hover,.resizeHandle.active{background:var(--accent);border-color:rgba(0,0,0,.5);}
  .app.presenting .resizeHandle{display:none!important;}
  .boxDeleteBtn{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:12px;line-height:16px;
    text-align:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .12s;}
  .vpTitle:not(.boxEmpty):hover .boxDeleteBtn,.vpSubtitle:not(.boxEmpty):hover .boxDeleteBtn,.vpExtraText:hover .boxDeleteBtn{opacity:1;pointer-events:auto;}
  .boxDeleteBtn:hover{border-color:var(--accent);color:var(--ink);}
  .app.presenting .boxDeleteBtn{display:none!important;}
  .app.presenting .vpSubtitle{pointer-events:none;cursor:default;}
  .guideLine{position:absolute;background:var(--accent);opacity:0;pointer-events:none;z-index:15;
    box-shadow:0 0 6px rgba(90,209,196,.7);transition:opacity .1s;}
  .guideLine.show{opacity:.85;}
  #guideV{top:0;bottom:0;width:1px;left:50%;}
  #guideH{left:0;right:0;height:1px;top:50%;}
  [data-title-font="bebas"] .vpTitle,[data-title-font="bebas"] .titleInput,
  [data-title-font="anton"] .vpTitle,[data-title-font="anton"] .titleInput,
  [data-title-font="archivoblack"] .vpTitle,[data-title-font="archivoblack"] .titleInput{letter-spacing:.04em;}
  [data-subtitle-font="bebas"] .vpSubtitle,[data-subtitle-font="bebas"] .subtitleInput,
  [data-subtitle-font="anton"] .vpSubtitle,[data-subtitle-font="anton"] .subtitleInput,
  [data-subtitle-font="archivoblack"] .vpSubtitle,[data-subtitle-font="archivoblack"] .subtitleInput{letter-spacing:.04em;}
  [data-label-font="bebas"] .swLabel,[data-label-font="bebas"] .legendItem,
  [data-label-font="anton"] .swLabel,[data-label-font="anton"] .legendItem,
  [data-label-font="archivoblack"] .swLabel,[data-label-font="archivoblack"] .legendItem{letter-spacing:.04em;}
  .vpHint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);pointer-events:none;transition:opacity .25s;}

  #presentUI{position:absolute;inset:0;z-index:8;pointer-events:none;}
  #presentUI.hidden{display:none;}
  #exitBtn{position:absolute;top:16px;right:16px;pointer-events:auto;background:rgba(14,20,32,.8);border:1px solid var(--line);
    border-radius:8px;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:8px 14px;cursor:pointer;}
  #exitBtn:hover{border-color:var(--hot);color:var(--hot);}
  #controlHints{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);text-shadow:0 1px 6px #000;}
  #controlHints b{color:var(--accent);font-weight:600;}
  #slideNav{position:absolute;bottom:14px;right:14px;display:none;align-items:center;gap:8px;
    background:rgba(14,20,32,.8);border:1px solid var(--line);border-radius:9px;padding:7px 9px;pointer-events:auto;}
  #slideNav.show{display:flex;}
  #slideNav button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--dim);
    width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;}
  #slideNav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  #slideNav button:disabled{opacity:.3;cursor:default;}
  #slideCounter{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.05em;min-width:34px;text-align:center;}
  #fallback{position:absolute;top:16px;left:16px;max-width:280px;pointer-events:auto;background:rgba(40,14,20,.85);
    border:1px solid var(--hot);border-radius:9px;color:#ffd0d8;font-size:11px;line-height:1.5;padding:10px 12px;display:none;}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="console">
    <div class="consoleTop">
      <button type="button" id="collapseBtn" class="themeToggle" title="Hide editing tools" aria-label="Hide editing tools">«</button>
      <button type="button" id="themeToggle" class="themeToggle" title="Switch to light theme" aria-label="Toggle editing theme">
        <span class="iconSun">☀</span><span class="iconMoon">☾</span>
      </button>
    </div>
    <div class="field">
      <label>Presentation title</label>
      <div class="titleFieldRow">
        <input id="titleInput" class="titleInput" value="" placeholder="Your title text" autocomplete="off" />
        <div class="titleTools">
          <div class="toolWrap">
            <button type="button" id="titleFontBtn" class="iconBtn" title="Font">Aa</button>
            <div class="fontPanel" id="fontPanel"></div>
          </div>
          <div class="toolWrap">
            <button type="button" id="titleBoldBtn" class="iconBtn" title="Bold"><b>B</b></button>
          </div>
          <div class="toolWrap">
            <button type="button" id="titleItalicBtn" class="iconBtn" title="Italic"><span class="italicIcon">I</span></button>
          </div>
          <div class="toolWrap">
            <input type="number" id="titleSizeInput" class="iconBtn sizeIconInput" title="Drag to resize, or type a size" min="0" max="160" step="1" value="16" />
          </div>
          <div class="toolWrap">
            <button type="button" id="titleColorBtn" class="colorSwatchBtn" title="Title color" aria-label="Title color" style="background:#eaf0fa"></button>
            <div class="colorPanel" id="titleColorPanel">
              <div class="colorSwatchGrid" id="titleColorGrid"></div>
              <div class="colorCustomRow">
                <input type="color" id="titleColorCustom" value="#eaf0fa" />
                <span>Custom</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Subtitle</label>
      <div class="titleFieldRow">
        <input id="subtitleInput" class="subtitleInput" placeholder="Optional subtitle" autocomplete="off" />
        <div class="titleTools">
          <div class="toolWrap">
            <button type="button" id="subtitleFontBtn" class="iconBtn" title="Font">Aa</button>
            <div class="fontPanel" id="subtitleFontPanel"></div>
          </div>
          <div class="toolWrap">
            <button type="button" id="subtitleBoldBtn" class="iconBtn" title="Bold"><b>B</b></button>
          </div>
          <div class="toolWrap">
            <button type="button" id="subtitleItalicBtn" class="iconBtn" title="Italic"><span class="italicIcon">I</span></button>
          </div>
          <div class="toolWrap">
            <input type="number" id="subtitleSizeInput" class="iconBtn sizeIconInput" title="Drag to resize, or type a size" min="0" max="160" step="1" value="14" />
          </div>
          <div class="toolWrap">
            <button type="button" id="subtitleColorBtn" class="colorSwatchBtn" title="Subtitle color" aria-label="Subtitle color" style="background:#7e8fb0"></button>
            <div class="colorPanel" id="subtitleColorPanel">
              <div class="colorSwatchGrid" id="subtitleColorGrid"></div>
              <div class="colorCustomRow">
                <input type="color" id="subtitleColorCustom" value="#7e8fb0" />
                <span>Custom</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="field">
      <div class="chartTypeHead">
        <label>Extra text <span class="sizeVal">(double-click on the board to edit)</span></label>
        <button type="button" id="addTextBtn" class="addRuleBtn" title="Add a text box to the board">+</button>
      </div>
    </div>
    <div class="field">
      <label>Label style <span class="sizeVal">(rings/callout are exclusive · legend can combine · hover for style)</span></label>
      <div class="segRow" id="labelModeRow">
        <div class="segWithDrop">
          <button class="seg active" data-mode="rings">Rings</button>
          <div class="stylePanel" id="ringsStylePanel">
            <button type="button" class="styleOption active" data-style="pill">Pill</button>
            <button type="button" class="styleOption" data-style="minimal">Minimal</button>
            <button type="button" class="styleOption" data-style="outline">Outline</button>
          </div>
        </div>
        <div class="segWithDrop">
          <button class="seg" data-mode="legend">Legend</button>
          <div class="stylePanel" id="legendStylePanel">
            <button type="button" class="styleOption active" data-style="list">List</button>
            <button type="button" class="styleOption" data-style="chips">Chips</button>
          </div>
        </div>
        <div class="segWithDrop">
          <button class="seg" data-mode="callout" title="Leader line from label to point, with value">Callout</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Label font</label>
      <div class="titleTools">
        <div class="toolWrap">
          <button type="button" id="labelFontBtn" class="iconBtn" title="Font">Aa</button>
          <div class="fontPanel" id="labelFontPanel"></div>
        </div>
        <div class="toolWrap">
          <button type="button" id="labelBoldBtn" class="iconBtn" title="Bold"><b>B</b></button>
        </div>
        <div class="toolWrap">
          <button type="button" id="labelItalicBtn" class="iconBtn" title="Italic"><span class="italicIcon">I</span></button>
        </div>
        <div class="toolWrap">
          <input type="number" id="labelSizeInput" class="iconBtn sizeIconInput" title="Drag to resize, or type a size" min="0" max="160" step="1" value="12" />
        </div>
        <div class="toolWrap">
          <button type="button" id="labelColorBtn" class="colorSwatchBtn" title="Label color" aria-label="Label color" style="background:#eaf0fa"></button>
          <div class="colorPanel" id="labelColorPanel">
            <div class="colorSwatchGrid" id="labelColorGrid"></div>
            <div class="colorCustomRow">
              <input type="color" id="labelColorCustom" value="#eaf0fa" />
              <span>Custom</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="tableWrap">
      <div class="thead"><span>Label</span><span style="text-align:right">Value</span><span>Group</span><span></span></div>
      <div id="rows"></div>
      <button class="addRow" id="addRow">+ add row</button>
    </div>
    <div class="cfoot">
      <div class="warnMsg" id="warnMsg"></div>
      <div class="cfootField">
        <div class="chartTypeHead">
          <label>Chart type</label>
          <button type="button" id="addChartRuleBtn" class="addRuleBtn" title="Mix in another chart type for a specific group">+</button>
        </div>
        <div id="chartTypeRules"></div>
      </div>
      <div class="cfootField">
        <label>Particle shape</label>
        <div class="segRow slider" id="shapeRow">
          <span class="segThumb"></span>
          <button class="seg active" data-shape="tetra">Tetra</button>
          <button class="seg" data-shape="sphere">Sphere</button>
          <button class="seg" data-shape="cube">Cube</button>
          <button class="seg" data-shape="octa">Octa</button>
        </div>
      </div>
      <div class="cfootField">
        <label>Background</label>
        <div class="swatchRow" id="bgRow"></div>
        <div class="meshEditor" id="meshEditor">
          <div class="meshCanvas" id="meshCanvas"></div>
          <div id="meshPointRows"></div>
          <button type="button" class="addRow" id="addMeshPointBtn">+ Add color point</button>
        </div>
      </div>
      <div class="cfootField">
        <label>Gesture controls <span class="sizeVal">(tap to reassign)</span></label>
        <div class="gestureRows" id="gestureRows"></div>
      </div>
      <div class="cfootField">
        <label>Camera preview <span class="sizeVal">(shown while presenting)</span></label>
        <div class="segRow slider" id="handPreviewRow">
          <span class="segThumb"></span>
          <button class="seg active" data-preview="off">Off</button>
          <button class="seg" data-preview="skeleton">Skeleton</button>
          <button class="seg" data-preview="camera">Camera</button>
        </div>
      </div>
      <button class="presentBtn" id="presentBtn">▶ Present</button>
    </div>
  </section>

  <div class="stage">
  <section class="viewport" id="viewport">
    <button type="button" id="expandBtn" title="Show editing tools" aria-label="Show editing tools">»</button>
    <button type="button" id="floatingPresentBtn" title="Present">▶ Present</button>
    <div id="gl"></div>
    <div id="labels"></div>
    <svg id="calloutLines" class="calloutLines"></svg>
    <div id="callouts"></div>
    <div id="legendLeft" class="legendCol left"></div>
    <div id="legendRight" class="legendCol right"></div>
    <div class="vpTitle" id="vpTitle"></div>
    <div class="vpSubtitle" id="vpSubtitle"></div>
    <div id="extraTexts"></div>
    <div class="guideLine" id="guideV"></div>
    <div class="guideLine" id="guideH"></div>

    <div id="presentUI" class="hidden">
      <button id="exitBtn">✕ Exit · Esc</button>
      <div id="controlHints"><b>Point</b> rotate &nbsp;·&nbsp; <b>Open palm</b> zoom &nbsp;·&nbsp; <b>Fist</b> reset &nbsp;·&nbsp; <b>Peace</b> next slide &nbsp;·&nbsp; <b>Thumbs up</b> previous slide</div>
      <div id="slideNav">
        <button id="prevSlideBtn" title="Previous slide (←)">‹</button>
        <span id="slideCounter"></span>
        <button id="nextSlideBtn" title="Next slide (→)">›</button>
      </div>
      <div id="fallback">Camera unavailable — presenting with mouse instead. Drag to rotate, scroll to zoom.</div>
    </div>
    <div id="handPreview" class="handPreview">
      <canvas id="skeletonCanvas" width="180" height="135"></canvas>
      <div id="handPreviewStatus" class="handPreviewStatus">
        <svg class="handPreviewIcon" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 8a2 2 0 0 1 2-2h2.2l1.4-2h6.8l1.4 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <line class="slashLine" x1="1" y1="3" x2="23" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span id="handPreviewStatusText"></span>
      </div>
    </div>

  </section>
  <div class="slideStrip" id="slideStrip"></div>
  </div>
</div>

<script>
/* ===================== STATE ===================== */
const PALETTE=[0x26f0c8,0x5aa9ff,0xff8c2b,0xb98cff,0xff5d8a,0x7cff7c,0xffd166,0x4dd0e1];
let ROW_ID=0;
const TITLE_FONTS=[

function setupScrubbableSize(input,getSize,setSize,applySize){
  let scrubbing=false, moved=false, startX=0, startVal=0;
  input.addEventListener("pointerdown",e=>{
    scrubbing=true; moved=false; startX=e.clientX; startVal=getSize();
    input.setPointerCapture(e.pointerId);
  });
  input.addEventListener("pointermove",e=>{
    if(!scrubbing) return;
    const dx=e.clientX-startX;
    if(!moved){
      if(Math.abs(dx)<4) return;
      moved=true; input.classList.add("scrubbing"); input.blur();
    }
    setSize(clamp(Math.round(startVal+dx*0.5),0,160));
    applySize();
  });
  function stop(e){
    if(!scrubbing) return;
    scrubbing=false; input.classList.remove("scrubbing");
    try{ input.releasePointerCapture(e.pointerId); }catch(err){}
  }
  input.addEventListener("pointerup",stop);
  input.addEventListener("pointercancel",stop);
}

  const jiggle=0.3*(1-isTract);
  const jX=Math.sin(gt*5+i)*jiggle, jY=Math.cos(gt*6.2+i*2)*jiggle, jZ=Math.sin(gt*4.1-i)*jiggle;
  out.set(x+jX,y+jY,z+jZ);
  return Math.max(0,Math.min(1,0.15+wave*0.25+spike*0.7-isTract*0.05));
}
function neuralParticle(i,gt,out,colorOut){
  const lgt=neuralPosition(i,gt,out);
  const nDom=DOMAINS.length;
  if(nDom&&regionIndex[i]>=0){
    const dom=DOMAINS[regionIndex[i]];
    colorOut.setRGB(lgt*dom.color.r,lgt*dom.color.g,lgt*dom.color.b);
  } else {
    colorOut.setHSL(0.62,0.7,lgt);
  }
}

function rebuildDomains(){
  const gc=groupColors();
  const rows=state.rows
    .filter(x=>x.label.trim()!==""||x.group.trim()!==""||x.value!==0)
    .map((x,i)=>x.label.trim()!==""?x:{...x,label:`Item ${i+1}`});
  const N=rows.length;
  if(!N){ DOMAINS=[]; buildLabels(); mesh.visible=false; return; }
  const order=rows.map((_,i)=>i).sort((a,b)=>Math.abs(rows[b].value)-Math.abs(rows[a].value));
  const rank=new Array(N); order.forEach((idx,rk)=>rank[idx]=rk);
  const rules=state.chartTypeRules&&state.chartTypeRules.length?state.chartTypeRules:[{group:"",chartType:"swarm"}];
  function chartTypeForRow(row){
    const key=rowKey(row);
    for(let ri=rules.length-1;ri>=1;ri--){ if(rules[ri].group===key) return rules[ri].chartType||"swarm"; }
    return rules[0].chartType||"swarm";
  }
  DOMAINS=rows.map((row,i)=>{
    const t=N>1?rank[i]/(N-1):0, c=new THREE.Color(colorFor(row,gc,i)), s=i*12.9898;
    const rot=makeRotMat((Math.sin(s)*0.5+0.5)*Math.PI*2,(Math.sin(s*1.7)*0.5+0.5)*Math.PI*2,(Math.sin(s*2.3)*0.5+0.5)*Math.PI*2);
    const radius=30+(1-t)*42, tube=7+t*15;
    const anchor=new THREE.Vector3(radius+tube,0,0).applyMatrix3(rot);
    const chartType=chartTypeForRow(row);
    return { value:Math.max(0,Math.abs(row.value)),radius,tube,speed:2.0-t*1.4,chaos:0.5+t*4.3,rot,color:{r:c.r,g:c.g,b:c.b},label:row.label,anchor,chartType };
  });

  // galaxy arm spacing should only consider domains actually rendered as galaxy, not every domain
  const galaxyDomains=DOMAINS.filter(d=>d.chartType==="galaxy");
  galaxyDomains.forEach((d,gi)=>{ d.galaxyRank=gi; d.galaxyCount=galaxyDomains.length; });

  const totalV=DOMAINS.reduce((s,d)=>s+d.value,0)||1;
  let cum=0; const cumArr=DOMAINS.map(d=>(cum+=d.value/totalV));
  DOMAINS.forEach((d,di)=>{
    const st=di===0?0:cumArr[di-1], en=cumArr[di];
    d.midIndex=Math.min(COUNT-1,Math.max(0,Math.floor(((st+en)/2)*COUNT)));
  });

  // particle allocation, scattered (via PERM) so a domain's subset samples evenly across shared-shape modes like Starlight/Neural
  for(let i=0;i<COUNT;i++){
    const n=PERM[i]/COUNT; let di=DOMAINS.length-1;
    for(let d=0;d<DOMAINS.length;d++){ if(n<cumArr[d]){ di=d; break; } }
    regionIndex[i]=di;
    const st=di===0?0:cumArr[di-1], en=cumArr[di]; armPos[i]=(n-st)/((en-st)||1);
  }
  buildLabels();
  mesh.visible = true;
}

function buildMeshCSS(points){
  const layers=points.map(p=>{ const rad=((p.r||.6)*100).toFixed(0); return `radial-gradient(${rad}% ${rad}% at ${(p.x*100).toFixed(1)}% ${(p.y*100).toFixed(1)}%, ${p.color} 0%, transparent 70%)`; });
  layers.push("linear-gradient(#03050c,#03050c)");
  return layers.join(",");

function hexToRgb(hex){ const n=parseInt(hex.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r,g,b){ return "#"+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join(""); }
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return [h, max===0?0:d/max, max];
}
function hsvToRgb(h,s,v){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return [(r+m)*255,(g+m)*255,(b+m)*255];
}

const SNAP=0.018;
function setBoxText(el,text){ el.textContent=text; el.classList.toggle("boxEmpty",!text); if(el._resizeHandle) el.appendChild(el._resizeHandle); if(el._deleteBtn) el.appendChild(el._deleteBtn); }
function setupTextBox(el,posGet,posSet,sizeGet,sizeSet,applySize,minSize,maxSize,textSet,syncInput,onRemove){
  const handle=document.createElement("div"); handle.className="resizeHandle"; handle.contentEditable="false"; el.appendChild(handle);
  el._resizeHandle=handle;
  const delBtn=document.createElement("div"); delBtn.className="boxDeleteBtn"; delBtn.contentEditable="false"; delBtn.title="Delete text"; delBtn.textContent="×"; el.appendChild(delBtn);
  el._deleteBtn=delBtn;
  let dragging=false;
  function applyPos(){
    const p=posGet();

  }
  function commitEdit(){
    if(el.contentEditable!=="true") return;
    el.contentEditable="false";
    const text=el.textContent;
    el.classList.toggle("boxEmpty",!text);
    if(!text) el.classList.remove("fontChosen");
    el.appendChild(handle);
    el.appendChild(delBtn);
    textSet(text);
    syncInput(text);
  }
  delBtn.addEventListener("pointerdown",e=>{ e.stopPropagation(); });
  delBtn.addEventListener("click",e=>{
    e.stopPropagation();
    if(presenting) return;
    if(onRemove){ onRemove(); return; }
    el.classList.remove("fontChosen");
    setBoxText(el,"");
    textSet("");
    syncInput("");
  });
  el.addEventListener("dblclick",e=>{
    if(presenting||e.target===handle||e.target===delBtn) return;
    e.stopPropagation();
    if(handle.parentNode===el) el.removeChild(handle);
    if(delBtn.parentNode===el) el.removeChild(delBtn);
    el.contentEditable="true";
    el.classList.remove("boxEmpty");
    el.focus();
    const range=document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  });
  el.addEventListener("blur",commitEdit);
  el.addEventListener("input",()=>{ if(el.contentEditable==="true") el.classList.toggle("boxEmpty",!el.textContent); });
  el.addEventListener("keydown",e=>{
    if(el.contentEditable==="true"&&(e.key==="Enter"||e.key==="Escape")){ e.preventDefault(); el.blur(); }
  });
  el.addEventListener("pointerdown",e=>{
    if(presenting||e.target===handle||e.target===delBtn||el.contentEditable==="true") return;
    e.stopPropagation();
    dragging=true;
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove",e=>{
    if(!dragging) return;
    const rect=vp.getBoundingClientRect();
    let x=clamp((e.clientX-rect.left)/rect.width,0.03,0.97), y=clamp((e.clientY-rect.top)/rect.height,0.03,0.97);
    const snapX=Math.abs(x-0.5)<SNAP, snapY=Math.abs(y-0.5)<SNAP;
    if(snapX) x=0.5;
    if(snapY) y=0.5;
    guideVEl.classList.toggle("show",snapX);
    guideHEl.classList.toggle("show",snapY);
    posSet({x,y});
    applyPos();
  });
  function stop(e){
    if(!dragging) return;
    dragging=false; el.classList.remove("dragging");
    guideVEl.classList.remove("show"); guideHEl.classList.remove("show");
    try{ el.releasePointerCapture(e.pointerId); }catch(err){}
  }
  el.addEventListener("pointerup",stop);
  el.addEventListener("pointercancel",stop);

  let resizing=false, rStartX=0, rStartY=0, rStartSize=0;
  handle.addEventListener("pointerdown",e=>{
    if(presenting) return;
    e.stopPropagation();
    resizing=true; rStartX=e.clientX; rStartY=e.clientY; rStartSize=sizeGet();
    handle.classList.add("active");
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove",e=>{
    if(!resizing) return;
    const d=(e.clientX-rStartX)+(e.clientY-rStartY);
    sizeSet(clamp(Math.round(rStartSize+d*0.25),minSize,maxSize));
    applySize();
  });
  function stopResize(e){
    if(!resizing) return;
    resizing=false;
    handle.classList.remove("active");
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
  }
  handle.addEventListener("pointerup",stopResize);
  handle.addEventListener("pointercancel",stopResize);
  return applyPos;
}

/* ===================== GESTURE (MediaPipe) ===================== */
const hand={gesture:'none',x:0,y:0,active:false,landmarks:null};
const CONNECTIONS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function detectGesture(lm){
  const up=(tip,pip)=>lm[tip].y<lm[pip].y;
  const index=up(8,6),middle=up(12,10),ring=up(16,14),pinky=up(20,18);
  const n=[index,middle,ring,pinky].filter(Boolean).length;
  const thumbUp=lm[4].y<lm[3].y && lm[3].y<lm[2].y && lm[4].y<lm[5].y;
  if(n===0&&thumbUp) return 'thumbsup';
  if(n===0) return 'fist';
  if(n===4) return 'open';
  if(n===2&&index&&middle&&!ring&&!pinky) return 'peace';
  if(n===1&&index&&!middle&&!ring&&!pinky) return 'point';
  return 'none';
}

/* user-remappable gesture -> action bindings */
const GESTURES=[
  {id:'fist',label:'Fist',emoji:'✊'},
  {id:'point',label:'Point',emoji:'☝️'},
  {id:'peace',label:'Peace',emoji:'✌️'},
  {id:'thumbsup',label:'Thumbs up',emoji:'👍'},
  {id:'open',label:'Open palm',emoji:'🖐️'},
];
const GESTURE_ACTIONS=[
  {id:'rotate',label:'Rotate view',hint:'rotate'},
  {id:'zoom',label:'Zoom',hint:'zoom'},
  {id:'reset',label:'Reset view',hint:'reset'},
  {id:'next',label:'Next slide',hint:'next slide'},
  {id:'prev',label:'Previous slide',hint:'previous slide'},
];
let gestureMap={rotate:'point',zoom:'open',reset:'fist',next:'peace',prev:'thumbsup'};
function gestureLabel(id){ return id==null ? "None" : (GESTURES.find(g=>g.id===id)||{}).label||id; }
function gestureEmoji(id){ return id==null ? "" : (GESTURES.find(g=>g.id===id)||{}).emoji||''; }
function handIcon(id){
  const span=document.createElement("span"); span.className="handIcon"; span.textContent=id==null?"—":gestureEmoji(id);
  return span;
}
const gestureRowsEl=document.getElementById("gestureRows");
function assignGesture(actionId,gestureId){
  if(gestureMap[actionId]===gestureId) return;
  // assigning "None" shouldn't trigger the swap-with-whoever-had-it logic below (multiple
  // actions can be unassigned at once with no conflict)
  if(gestureId!=null){
    const otherAction=Object.keys(gestureMap).find(k=>k!==actionId&&gestureMap[k]===gestureId);
    if(otherAction) gestureMap[otherAction]=gestureMap[actionId];
  }
  gestureMap[actionId]=gestureId;
  renderGestureRows();
  updateControlHints();
}
function renderGestureRows(){
  gestureRowsEl.innerHTML="";
  GESTURE_ACTIONS.forEach(action=>{
    const row=document.createElement("div"); row.className="gestureRow";
    const label=document.createElement("span"); label.className="actionLabel"; label.textContent=action.label;
    const assigned=gestureMap[action.id];
    const btn=document.createElement("button"); btn.type="button"; btn.className="gestureBtn"+(assigned==null?" unassigned":"");
    btn.appendChild(handIcon(assigned));
    const btnLabel=document.createElement("span"); btnLabel.textContent=gestureLabel(assigned);
    btn.appendChild(btnLabel);
    const panel=document.createElement("div"); panel.className="gesturePanel";
    const noneOpt=document.createElement("button"); noneOpt.type="button";
    noneOpt.className="gestureOption noneOption"+(assigned==null?" active":"");
    noneOpt.appendChild(handIcon(null));
    const noneLabel=document.createElement("span"); noneLabel.textContent="None (turn off)";
    noneOpt.appendChild(noneLabel);
    noneOpt.addEventListener("click",e=>{ e.stopPropagation(); assignGesture(action.id,null); });
    panel.appendChild(noneOpt);
    GESTURES.forEach(g=>{
      const opt=document.createElement("button"); opt.type="button";
      opt.className="gestureOption"+(assigned===g.id?" active":"");
      opt.appendChild(handIcon(g.id));
      const optLabel=document.createElement("span"); optLabel.textContent=g.label;
      opt.appendChild(optLabel);
      opt.addEventListener("click",e=>{ e.stopPropagation(); assignGesture(action.id,g.id); });
      panel.appendChild(opt);
    });
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const wasOpen=panel.classList.contains("open");
      gestureRowsEl.querySelectorAll(".gesturePanel").forEach(p=>p.classList.remove("open"));
      if(!wasOpen) panel.classList.add("open");
    });
    row.appendChild(label); row.appendChild(btn); row.appendChild(panel);
    gestureRowsEl.appendChild(row);
  });
}
document.addEventListener("click",e=>{
  if(!gestureRowsEl.contains(e.target)) gestureRowsEl.querySelectorAll(".gesturePanel").forEach(p=>p.classList.remove("open"));
});

function drawSkeleton(){
  const w=skeletonCanvasEl.width,h=skeletonCanvasEl.height;
  skelCtx.clearRect(0,0,w,h);
  if(!hand.landmarks) return;
  const lm=hand.landmarks;
  skelCtx.strokeStyle="rgba(90,209,196,.9)"; skelCtx.lineWidth=2;

  });

let mpHands=null, mpVideo=null, mpStream=null, scriptsReady=false, trackingLoopId=null, mpReady=false;
const fallbackEl=document.getElementById("fallback");
const controlHintsEl=document.getElementById("controlHints");
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)){res();return;} const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function updateControlHints(){
  controlHintsEl.innerHTML = mpReady
    ? GESTURE_ACTIONS.filter(a=>gestureMap[a.id]!=null).map(a=>`<b>${gestureLabel(gestureMap[a.id])}</b> ${a.hint}`).join(" &nbsp;·&nbsp; ")
    : "<b>Drag</b> rotate &nbsp;·&nbsp; <b>Scroll</b> zoom &nbsp;·&nbsp; <b>←/→</b> slides";
}
async function ensureHandsLoaded(){
  if(scriptsReady) return;
  await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js");
  mpVideo=document.createElement("video"); mpVideo.autoplay=true; mpVideo.muted=true; mpVideo.playsInline=true;
  mpHands=new window.Hands({ locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  mpHands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.75, minTrackingConfidence:0.65 });
  mpHands.onResults(res=>{
    if(res.multiHandLandmarks && res.multiHandLandmarks.length){
      const lm=res.multiHandLandmarks[0];
      hand.gesture=detectGesture(lm);
      hand.x=(1-lm[8].x)*2-1; hand.y=-(lm[8].y*2-1);
      hand.active=true; hand.landmarks=lm;
    } else { hand.gesture='none'; hand.active=false; hand.landmarks=null; }
  });
  scriptsReady=true;
}
async function startCamera(){
  if(mpStream) return;
  fallbackEl.style.display="none";
  cameraError=false; updateHandPreviewStatus();
  try{
    await ensureHandsLoaded();
    mpStream=await navigator.mediaDevices.getUserMedia({ video:{width:640,height:480,facingMode:'user'} });
    mpVideo.srcObject=mpStream; await mpVideo.play();
    mpReady=true; updateControlHints(); updateHandPreviewVisibility();
    const loop=async()=>{
      if(!mpReady) return;
      await mpHands.send({image:mpVideo});
      if(!mpReady) return;
      trackingLoopId=requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    mpReady=false; cameraError=true; fallbackEl.style.display="block"; updateControlHints(); updateHandPreviewVisibility();
  }
}
function stopCamera(){
  mpReady=false;
  if(trackingLoopId){ cancelAnimationFrame(trackingLoopId); trackingLoopId=null; }
  if(mpStream){ mpStream.getTracks().forEach(t=>t.stop()); mpStream=null; }
  hand.active=false; hand.landmarks=null; hand.gesture='none';
  updateHandPreviewVisibility();
}
/* gesture -> camera (ported anchor / dead-zone model), bindings driven by gestureMap */
const anchor={hx:0,hy:0,theta:0,phi:0}; let wasPoint=false, lastGesture='none';
function gestureControl(){
  if(!hand.active){ wasPoint=false; lastGesture='none'; if(idle) cam.theta+=0.0016; return; }
  const g=hand.gesture;
  const isPoint=g===gestureMap.rotate, isOpen=g===gestureMap.zoom;
  if(isPoint){
    if(!wasPoint){ anchor.hx=hand.x; anchor.hy=hand.y; anchor.theta=cam.theta; anchor.phi=cam.phi; }
    cam.theta=anchor.theta-(hand.x-anchor.hx)*Math.PI;
    cam.phi=clamp(anchor.phi-(hand.y-anchor.hy)*1.45,0.12,Math.PI-0.12);
  }
  if(isOpen){
    const offset=0.5-hand.y, mag=Math.abs(offset), DEAD=0.08;
    if(mag>DEAD){ const t=(mag-DEAD)/(0.5-DEAD); cam.r=clamp(cam.r+(offset>0?-t:t)*3.4,R_MIN,R_MAX); }
  }
  if(g===gestureMap.reset){ cam.theta+=(0.5-cam.theta)*0.06; cam.phi+=(PHI_DEFAULT-cam.phi)*0.06; cam.r+=(R_DEF-cam.r)*0.06; }
  if(g!==lastGesture&&g!=='none'){
    if(g===gestureMap.next) nextSlide();
    else if(g===gestureMap.prev) prevSlide();
  }
  lastGesture=g;
  wasPoint=isPoint;
}

/* ===================== RENDER LOOP ===================== */
const clock=new THREE.Clock(), proj=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);
  if(presenting||mpReady) gestureControl();
  else if(idle) cam.theta+=0.0016;
  if(mpReady&&handPreviewMode==='skeleton') drawSkeleton();

  if(!is3DMode()) return;

  const gt=clock.getElapsedTime();
  if(mesh.visible){
    for(let i=0;i<COUNT;i++){
      const di=regionIndex[i]; if(di<0) continue;
      const d=DOMAINS[di], type=d.chartType;
      if(type==="galaxy"){ galaxyParticle(i,gt,torusVec,pColor); }
      else if(type==="rowshi"){ rowshiParticle(i,gt,torusVec,pColor); }
      else if(type==="neural"){ neuralParticle(i,gt,torusVec,pColor); }
      else{
        const tLocal=armPos[i], tt=gt*d.speed;
        const u=tLocal*Math.PI*2*13.0+tt*0.3, v=tLocal*Math.PI*2*412.0-tt*1.5;
        const harm=Math.sin(u*3.0+tt), dynTube=d.tube*(0.5+0.5*harm);
        const tnoise=Math.sin(i*789.123)*d.chaos, smod=Math.cos(u*5.0)*d.chaos*0.5;
        torusVec.set(
          (d.radius+dynTube*Math.cos(v)+tnoise)*Math.cos(u),
          (d.radius+dynTube*Math.cos(v)+tnoise)*Math.sin(u),
          dynTube*Math.sin(v)+tnoise+Math.sin(u*4.0)*smod
        ).applyMatrix3(d.rot);
        const lgt=Math.max(0.12,0.3+0.5*Math.abs(harm)+tnoise*0.05);
        pColor.setRGB(lgt*d.color.r,lgt*d.color.g,lgt*d.color.b);
      }
      positions[i].lerp(torusVec,0.1);
      dummy.position.copy(positions[i]); dummy.updateMatrix(); mesh.setMatrixAt(i,dummy.matrix);
      mesh.setColorAt(i,pColor);
    }
    mesh.instanceMatrix.needsUpdate=true; if(mesh.instanceColor) mesh.instanceColor.needsUpdate=true;
  }

  camera.position.set(cam.r*Math.sin(cam.phi)*Math.sin(cam.theta), cam.r*Math.cos(cam.phi), cam.r*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);

  if(state.labelRings) positionLabels();
  if(state.labelCallout) positionCallouts();
}
function domainAnchor(d,idx,nDom,gt){
  const type=d.chartType||"swarm";
  if(type==="galaxy"){
    const gCount=d.galaxyCount||1, gRank=d.galaxyRank||0;
    const armBase=(gRank/gCount)*Math.PI*2.0, rNorm=0.92;
    const radius=rNorm*GALAXY_P.scale;
    const spiralAng=armBase+rNorm*GALAXY_P.twist*Math.PI+gt*GALAXY_P.drift;
    const py=(1.0-rNorm)*GALAXY_P.thick*GALAXY_P.core*0.3;
    return torusVec.set(Math.cos(spiralAng)*radius,py,Math.sin(spiralAng)*radius);
  }
  if(type==="rowshi"){
    rowshiPosition(d.midIndex,gt,torusVec);
    return torusVec;
  }
  if(type==="neural"){
    neuralPosition(d.midIndex,gt,torusVec);
    return torusVec;
  }
  return d.anchor;
}
function positionLabels(){
  const w=glEl.clientWidth,h=glEl.clientHeight, placed=[], gt=clock.getElapsedTime(), nDom=DOMAINS.length;
  DOMAINS.forEach((d,i)=>{
    const el=labelEls[i]; if(!el) return;
    proj.copy(domainAnchor(d,i,nDom,gt)).applyMatrix4(world.matrixWorld).project(camera);
    if(proj.z>1){ el.style.display="none"; return; }
    el.style.display="block";
    const opacity=0.65+0.35*(1-Math.min(1,Math.max(0,proj.z)));
    placed.push({ el, x:(proj.x*.5+.5)*w, y:(-proj.y*.5+.5)*h, z:proj.z, opacity });
  });
  placed.sort((a,b)=>a.z-b.z); // nearer labels claim their spot first, farther ones give way
  const boxes=[];
  placed.forEach(p=>{
    const bw=p.el.offsetWidth||60, bh=p.el.offsetHeight||20;
    let x=p.x, y=p.y, tries=0;
    while(tries<24 && boxes.some(b=>Math.abs(x-b.x)<(bw+b.w)/2+8 && Math.abs(y-b.y)<(bh+b.h)/2+6)){
      y+=bh+6; tries++;
    }
    boxes.push({x,y,w:bw,h:bh});
    p.el.style.left=x+"px"; p.el.style.top=y+"px"; p.el.style.opacity=p.opacity;
  });
}
function positionCallouts(){
  const w=glEl.clientWidth,h=glEl.clientHeight, items=[], gt=clock.getElapsedTime(), nDom=DOMAINS.length;
  const cx=w/2, cy=h/2;
  DOMAINS.forEach((d,i)=>{
    const el=calloutEls[i], line=calloutLineEls[i]; if(!el||!line) return;
    proj.copy(domainAnchor(d,i,nDom,gt)).applyMatrix4(world.matrixWorld).project(camera);
    if(proj.z>1){ el.style.display="none"; line.style.display="none"; return; }
    el.style.display="flex"; line.style.display="block";
    const opacity=0.65+0.35*(1-Math.min(1,Math.max(0,proj.z)));
    const ax=(proj.x*.5+.5)*w, ay=(-proj.y*.5+.5)*h;
    items.push({ el, line, ax, ay, z:proj.z, opacity, side: ax<cx?"left":"right" });
  });
  if(!items.length) return;
  // chartR still sets how far out the label column sits from the chart's center, but each
  // line's inner end now tracks the point's real projected position (ax,ay) directly, so it
  // always lands on that item's own color instead of a shared stand-in radius that could
  // overshoot into a neighboring, differently-colored cluster in overlapping chart types.
  const chartR=Math.max(...items.map(p=>Math.hypot(p.ax-cx,p.ay-cy)))*1.04;
  items.forEach(p=>{ p.bx=p.ax; p.by=p.ay; });
  const gap=26;
  ["left","right"].forEach(side=>{
    const col=items.filter(p=>p.side===side).sort((a,b)=>a.by-b.by);
    if(!col.length) return;
    // reserve room for the widest label in this column so it can't overflow past the viewport edge
    const maxBw=Math.max(...col.map(p=>p.el.offsetWidth||60));
    const rawEdge = side==="left" ? cx-chartR-gap : cx+chartR+gap;
    const edgeX = side==="left" ? Math.max(40+maxBw,rawEdge) : Math.min(w-40-maxBw,rawEdge);
    let cursor=-Infinity;
    col.forEach(p=>{
      // the value (not the dot+name) sits nearest the attach edge, on both sides, since that's
      // the number the line is actually pointing to
      p.el.classList.toggle("calloutRight",side==="right");
      const bw=p.el.offsetWidth||60, bh=p.el.offsetHeight||20;
      let y=Math.max(p.by,cursor);
      y=Math.min(Math.max(y,bh/2+4),h-bh/2-4);
      cursor=y+bh+6;
      // pin the label's near-chart edge to the spine and let it grow outward (away from the
      // chart) with longer text, so the line always meets its right/left edge, not its body
      const x = side==="left" ? edgeX-bw/2 : edgeX+bw/2;
      p.el.style.left=x+"px"; p.el.style.top=y+"px"; p.el.style.opacity=p.opacity;
      // single straight line, no bend -- into the label's near edge (the side facing the
      // chart), at whatever height the point naturally is, clamped to stay within the label's
      // own row so it always lands on the label instead of floating past it in either direction
      const topY=y-bh/2, bottomY=y+bh/2, entryY=Math.min(Math.max(p.by,topY),bottomY);
      // when many wide labels force edgeX inward (to avoid overflowing the viewport), a point
      // whose natural x is near the chart's silhouette can end up on the wrong side of edgeX,
      // making the line's start point coincide with or pass its own end point -- a near-zero or
      // backwards-pointing line that reads as broken/missing. A hard clamp (snap to a fixed
      // minimum the instant the point crosses a threshold) causes visible flicker/snapping as
      // the chart continuously animates the point back and forth across that line -- so this
      // uses a smooth minimum instead: it matches the point's real position when there's plenty
      // of margin, and eases toward (never below) a safe minimum as the margin shrinks, with no
      // discontinuity at any point. It also naturally preserves each point's own small
      // differences, so adjacent clamped labels still fan out instead of collapsing together.
      const minLineLen=45, softK=4000;
      const margin = side==="left" ? p.bx-edgeX : edgeX-p.bx;
      const safeMargin = (margin+minLineLen+Math.sqrt((margin-minLineLen)**2+softK))/2;
      const lineBx = side==="left" ? edgeX+safeMargin : edgeX-safeMargin;
      const points = `${lineBx},${p.by} ${edgeX},${entryY}`;
      p.line.setAttribute("points",points);
      p.line.style.opacity=p.opacity;
    });
  });
}

  const w=glEl.clientWidth,h=glEl.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
